name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]  # 3.9 = pyproject requires-python 下限
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Optional document parsers (PDF/DOCX ingestion contracts)
        run: python -m pip install --quiet pypdf python-docx
      - name: Structural spec check + full test suite (verification evidence is local-only)
        run: make ci
      - name: Build and clean-environment install smoke
        run: bash scripts/install_check.sh
      - name: Release gate stays closed without evidence
        run: |
          if make release-check; then
            echo "::error::release-check 不应在缺真实比较证据时通过"; exit 1
          else
            echo "release-check 按预期失败（证据未完成）"
          fi
