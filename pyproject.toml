[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domimap"
version = "0.4.0"
description = "多仓 Java 知识中台：把多个 Java 仓库与项目文档变成一张可查询的领域地图（CLI + MCP）"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "domimap contributors"}]
keywords = ["knowledge-graph", "java", "code-analysis", "mcp", "domain-map", "中文检索"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/SunArthurX/domimap"

[project.optional-dependencies]
docs = ["python-docx", "pypdf"]
cn = ["jieba"]
mcp = ["mcp>=2.3.0,<3"]   # 官方 MCP SDK（Python>=3.10）；自研 stdlib 服务端不受影响

[project.scripts]
domimap = "domimap.__main__:main"

[tool.setuptools]
packages = ["domimap"]

[tool.setuptools.package-data]
domimap = ["seeds.json"]
